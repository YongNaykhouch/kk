<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electronic Shop</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
    <!-- bootstrap links -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- fonts links -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather&display=swap" rel="stylesheet">
</head>
<body>

   <!-- Top Navbar -->
<div class="top-navbar">
  <p>WELCOME TO OUR SHOP</p>
  <div class="icons">
      <a href="{{ url_for('login') }}">
          <img src="{{ url_for('static', filename='images/login-icon.png') }}" alt="Login Icon" width="18px"> Login
      </a>
      <a href="{{ url_for('register') }}">
          <img src="{{ url_for('static', filename='images/register-icon.png') }}" alt="Register Icon" width="18px"> Register
      </a>
  </div>
</div>
<!-- End of Top Navbar -->

   <!-- navbar -->
<nav class="navbar navbar-expand-lg" id="navbar">
    <div class="container-fluid">
      <a class="navbar-brand" href="{{ url_for('order') }}" id="logo"><span id="span1">E</span>Lectronic <span>Shop</span></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" 
              aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span><img src="{{ url_for('static', filename='images/menu.png') }}" alt="" width="30px"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="{{ url_for('order') }}">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Product</a>
          </li>
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" 
               data-bs-toggle="dropdown" aria-expanded="false">
              Category
            </a>
            <ul class="dropdown-menu" aria-labelledby="navbarDropdown">
              <!-- Add your categories here -->
            </ul>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('about') }}">About</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('contact') }}">Contact</a>
          </li>
        </ul>
        <form class="d-flex" id="search">
          <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
          <button class="btn btn-outline-success" type="submit">Search</button>
        </form>
      </div>
    </div>
</nav>

<!-- Contact Section -->
<div class="container" id="contact">
    <div class="row" style="margin-top: 50px;">
        <!-- Contact cards -->
    </div>
    
    <form method="POST" action="{{ url_for('contact') }}">
        <div class="row" style="margin-top: 30px;">
            <div class="col-md-4 py-3 py-md-0">
                <input type="text" class="form-control" name="name" placeholder="Name" required>
            </div>
            <div class="col-md-4 py-3 py-md-0">
                <input type="email" class="form-control" name="email" placeholder="Email" required>
            </div>
            <div class="col-md-4 py-3 py-md-0">
                <input type="tel" class="form-control" name="phone" placeholder="Phone" required>
            </div>
            <div class="form-group" style="margin-top: 30px;">
                <textarea class="form-control" name="message" rows="5" placeholder="Message" required></textarea>
            </div>
            <div class="messagebtn text-center">
                <button type="submit" class="btn btn-primary">Send Message</button>
            </div>
        </div>
    </form>
</div>

<!-- Rest of the code remains similar with proper url_for fixes -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
