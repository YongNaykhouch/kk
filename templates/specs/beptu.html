<h5 class="text-secondary mb-4"><i class="fas fa-fan me-2"></i>Thông Số Kỹ Thuật - Bếp Từ </h5>
<div class="row g-3">
    <div class="col-md-6"><label>Công suất</label><input type="text" name="power" class="form-control" placeholder="VD: 55W"></div>
    <div class="col-md-6"><label>Số cấp độ gió</label><input type="text" name="speed_levels" class="form-control" placeholder="VD: 12 cấp"></div>
    <div class="col-md-6"><label>Điều khiển</label><input type="text" name="control_type" class="form-control" placeholder="VD: Cảm ứng + Remote"></div>
    <div class="col-md-6"><label>Xoay đảo chiều</label><input type="text" name="oscillation" class="form-control" placeholder="VD: 90 độ"></div>
    <div class="col-md-6"><label>Hẹn giờ</label><input type="text" name="timer" class="form-control" placeholder="VD: 1-15 giờ"></div>
    <div class="col-md-6"><label>Kích thước cánh</label><input type="text" name="size" class="form-control" placeholder="VD: 40cm"></div>
    <div class="col-md-6"><label>Loại cánh</label><input type="text" name="blade_type" class="form-control" placeholder="VD: 5 cánh nhựa ABS"></div>
    <div class="col-md-6"><label>Lọc không khí</label><input type="text" name="filter" class="form-control" placeholder="VD: Ion âm"></div>
