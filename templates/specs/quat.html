<h5 class="text-primary mb-4"><i class="fas fa-fan me-2"></i>Thông Số Kỹ Thuật - Quạt </h5>
<div class="row g-3">
    <div class="col-md-6"><label>Loại quạt</label><input type="text" name="fan_type" class="form-control" value="Tower Fan"></div>
    <div class="col-md-6"><label>Công suất</label><input type="text" name="power" class="form-control" placeholder="VD: 45W"></div>
    <div class="col-md-6"><label>Số cấp độ gió</label><input type="text" name="speed_levels" class="form-control" placeholder="VD: 3 levels"></div>
    <div class="col-md-6"><label>Điều khiển</label><input type="text" name="control_type" class="form-control" placeholder="VD: Remote"></div>
    <div class="col-md-6"><label>Xoay đảo chiều</label><input type="text" name="oscillation" class="form-control" placeholder="VD: 80 độ"></div>
    <div class="col-md-6"><label>Hẹn giờ</label><input type="text" name="timer" class="form-control" placeholder="VD: 1-8 giờ"></div>
</div>
