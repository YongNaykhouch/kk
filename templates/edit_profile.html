<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chỉnh sửa hồ sơ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }
        .card {
            max-width: 700px;
            margin: 0 auto;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        }
        .avatar-preview {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid #667eea;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card p-5">
        <h2 class="text-center mb-4">Chỉnh sửa hồ sơ</h2>

        <form method="POST" enctype="multipart/form-data">
            <div class="text-center mb-4">
                {% if user.avatar %}
                    <img src="{{ url_for('static', filename='uploads/' ~ user.avatar) }}" 
                         alt="Avatar" class="avatar-preview">
                {% else %}
                    <div class="avatar-preview d-inline-flex align-items-center justify-content-center bg-primary text-white fs-1">
                        {{ user.username[0]|upper }}
                    </div>
                {% endif %}
                <div class="mt-3">
                    <label class="btn btn-outline-primary">
                        <i class="fas fa-camera"></i> Thay đổi ảnh đại diện
                        <input type="file" name="avatar" accept="image/*" class="d-none">
                    </label>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label"><i class="fas fa-user"></i> Tên đăng nhập</label>
                <input type="text" class="form-control" value="{{ user.username }}" disabled>
            </div>

            <div class="mb-3">
                <label class="form-label"><i class="fas fa-envelope"></i> Email</label>
                <input type="email" class="form-control" value="{{ user.email }}" disabled>
            </div>

            <div class="mb-3">
                <label class="form-label"><i class="fas fa-phone"></i> Số điện thoại</label>
                <input type="text" name="phone" class="form-control" value="{{ user.phone or '' }}" placeholder="Nhập số điện thoại">
            </div>

            <div class="mb-3">
                <label class="form-label"><i class="fas fa-calendar"></i> Ngày sinh</label>
                <input type="date" name="dob" class="form-control" value="{{ user.dob or '' }}">
            </div>

            <div class="mb-4">
                <label class="form-label"><i class="fas fa-map-marker-alt"></i> Địa chỉ</label>
                <textarea name="address" class="form-control" rows="3" placeholder="Nhập địa chỉ">{{ user.address or '' }}</textarea>
            </div>

            <div class="text-center">
                <button type="submit" class="btn btn-primary btn-lg px-5">
                    <i class="fas fa-save"></i> Lưu thay đổi
                </button>
                <a href="{{ url_for('profile') }}" class="btn btn-secondary btn-lg px-5 ms-3">
                    Hủy
                </a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
